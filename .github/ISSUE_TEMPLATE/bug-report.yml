name: Package bug
about: Report a core, registry, cache, Laravel, CLI or template problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package and PHP versions
      placeholder: v0.2.0, PHP 8.3
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core orchestration
        - Game registry
        - Cache
        - Laravel integration
        - CLI
        - Web test template
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Remove player IDs, cookies, tokens and other personal or secret values.
